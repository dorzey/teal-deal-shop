# The tunnel's ingress rules for test.dorzey.net.
#
# compose.prod.yaml runs the tunnel from a token, which means the tunnel is
# "remotely managed": these rules are entered in the Cloudflare dashboard
# (Zero Trust -> Networks -> Tunnels -> your tunnel -> Public Hostnames), not read
# from this file. This is the same thing written out, for reference — or for a
# locally managed tunnel (`cloudflared tunnel --config <this file> run`).
#
# Two rules for ONE hostname, split by path, because quack's client always POSTs
# /quack. That keeps the site and the lake on one origin: no second hostname, no
# CORS. Order matters: first match wins, so the path rule goes first.
ingress:
  # the lake's read-only quack endpoint (dashboard)
  - hostname: test.dorzey.net
    path: ^/quack
    service: http://127.0.0.1:8789

  # everything else: storefront, dashboard, /collect, /order, ...
  - hostname: test.dorzey.net
    service: http://127.0.0.1:8787

  - service: http_status:404

# Dashboard equivalent, one "Public Hostname" per rule:
#   1. Subdomain test, domain dorzey.net, Path ^/quack   -> Service  HTTP  127.0.0.1:8789
#   2. Subdomain test, domain dorzey.net, Path (empty)   -> Service  HTTP  127.0.0.1:8787
# and make sure rule 1 is listed above rule 2.
