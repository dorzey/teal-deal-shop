<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Duck HQ 🦆 — Teal Deal's live dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%86%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#EAF2F1; --surface:#FFFFFF; --ink:#14282E; --muted:#5C7480;
    --line:#D7E3E0; --accent:#FFC93C; --accent-ink:#5A4600; --teal:#1E7A8C; --bill:#FF8C42;
    --shadow:0 1px 2px rgba(15,33,41,.06),0 8px 24px rgba(15,33,41,.06);
    --radius:16px;

    /* chart tokens — validated with dataviz/scripts/validate_palette.js against
       this page's --surface (#FFFFFF); see collector.py's get_dashboard() for
       the queries these charts render. */
    --chart-surface: var(--surface);
    --chart-grid: #E1E0D9;
    --chart-axis: #C3C2B7;
    --chart-text: var(--muted);
    --cat-dabbling: #0E86A0;        /* teal   */
    --cat-diving: #8B5FBF;       /* violet */
    --cat-sea: #E0A400; /* gold   */
    --cat-perching: #FF8C42;     /* orange (= --bill) */
    --ord-1: #6EBBCF; --ord-2: #0E86A0; --ord-3: #0A4E5C; /* funnel ramp, light->dark */
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px 60px}

  header{padding:34px 0 18px}
  .mark{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .mark h1{
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:30px;
    letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:8px;
  }
  .tag{font-size:14px;color:var(--muted);flex:1}
  .navlink{
    font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ink);
    text-decoration:none;background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:7px 14px;transition:border-color .12s ease;
  }
  .navlink:hover{border-color:var(--bill)}
  #refreshBtn{cursor:pointer}
  #refreshBtn.spin{animation:spin .6s linear}
  @keyframes spin{to{transform:rotate(360deg)}}

  .status{
    font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);
    display:flex;align-items:center;gap:8px;margin-top:4px;
  }
  .dot{flex:none;width:8px;height:8px;border-radius:50%;background:#C7CF45}
  .dot.ready{background:var(--teal)}
  .dot.loading{background:var(--accent);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.35}}

  /* stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:20px 0}
  .tile{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px 18px;
  }
  .tile .label{font-size:12.5px;color:var(--muted)}
  .tile .value{font-family:'Inter',sans-serif;font-weight:600;font-size:28px;margin-top:4px}
  .tile.pulse{animation:tilePulse 1s ease}
  @keyframes tilePulse{0%{background:#FFF6DC;border-color:var(--accent)}100%{background:var(--surface);border-color:var(--line)}}

  /* live write-throughput banner — see 07_stress.py + pollStressWrites() */
  .stress-bar{
    display:none;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--teal);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:10px 16px;margin-top:14px;
    font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink);
  }
  .stress-bar.show{display:flex}
  .stress-bar .bolt{color:var(--teal);animation:pulse 1s infinite}
  .stress-bar b{font-family:'Inter',sans-serif;font-weight:600}

  /* chart cards */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:860px){.cards{grid-template-columns:1fr}}
  /* phones: the four stat tiles as a 2x2 grid instead of four tall rows */
  @media (max-width:640px){
    header{padding:22px 0 12px}
    .tiles{grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
    .tile{padding:12px 14px}
    .tile .value{font-size:22px}
  }
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px;margin-bottom:16px;
  }
  .card.wide{grid-column:1/-1}
  .card.pulse{animation:cardPulse 1.1s ease}
  @keyframes cardPulse{
    0%{box-shadow:0 0 0 3px var(--accent), var(--shadow);border-color:var(--accent)}
    100%{box-shadow:var(--shadow);border-color:var(--line)}
  }
  .card h2{
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;margin:0 0 2px;
  }
  .card .sub{font-size:12px;color:var(--muted);margin-bottom:12px}

  .chart-svg{width:100%;height:auto;overflow:visible}
  .gridline{stroke:var(--chart-grid);stroke-width:1}
  .axis-line{stroke:var(--chart-axis);stroke-width:1}
  .axis-label{font-family:'Inter',sans-serif;font-size:10.5px;fill:var(--chart-text)}
  .bar-value{font-family:'Inter',sans-serif;font-weight:600;font-size:12px;fill:var(--ink)}
  .end-label{font-family:'Inter',sans-serif;font-weight:600;font-size:12px;fill:var(--ink)}
  .drop-label{font-family:'JetBrains Mono',monospace;font-size:11px;fill:var(--muted)}

  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .legend-swatch{width:10px;height:10px;border-radius:3px;flex:none}

  .empty{
    text-align:center;padding:60px 20px;color:var(--muted);
    border:1px dashed var(--line);border-radius:var(--radius);background:var(--surface);
  }
  .empty b{color:var(--ink);font-family:'Fredoka',sans-serif}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="xray.css" />
<script src="xray.js" defer></script>
<script type="importmap">
{ "imports": { "apache-arrow": "https://cdn.jsdelivr.net/npm/apache-arrow@17.0.0/+esm" } }
</script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">
      <h1>🦆 Duck HQ</h1>
      <span class="tag">Where the flock's numbers waddle in — live from oltp.duckdb + the lake.</span>
      <a class="navlink" href="./">🛍️ Back to the store</a>
      <a class="navlink" id="refreshBtn" href="#" title="Refresh">🔄 Refresh</a>
      <button class="navlink xraybtn" id="xrayBtn" type="button" aria-pressed="false">🩻 X-ray</button>
    </div>
    <div class="status"><span id="dot" class="dot loading"></span><span id="statusText">waddling the numbers together…</span></div>
  </header>

  <section class="xraybar" id="xrayBar" data-page="dashboard" aria-label="How this page uses DuckDB"></section>

  <div id="stressBar" class="stress-bar">
    <span class="bolt">⚡</span>
    <span>Concurrent-writer stress test (<code>07_stress.py</code>): <b id="stressCount">0</b> writes<span id="stressRate"></span></span>
  </div>

  <div id="content"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const xr = key => (window.tealXray ? window.tealXray.html(key) : '');   // X-ray label markup (xray.js)

const CATEGORY_EMOJI = { dabbling:'🦆', diving:'🤿', sea:'🌊', perching:'🌳' };
const CATEGORY_COLOR = { dabbling:'var(--cat-dabbling)', diving:'var(--cat-diving)', sea:'var(--cat-sea)', perching:'var(--cat-perching)' };

const num = v => typeof v === 'bigint' ? Number(v) : v;
const fmtCompact = n => n.toLocaleString('en', { notation: 'compact', maximumFractionDigits: 1 });
const fmtQ = n => `Q${n.toLocaleString('en', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

// ---- funnel/retention/daily, live via Quack (DuckDB-WASM attaches straight to
// collector.py's DuckLake connection over HTTP, no /dashboard-data round-trip)
// -------------------------------------------------------------------------------
// revenue_by_category/totals stay on /dashboard-data below. Dynamic import()
// (not a <script type="module">) so this doesn't change how the rest of this
// classic script executes. No fallback: collector.py's get_dashboard() doesn't
// compute funnel/retention/daily at all, so if this fails, those cards just
// show a waiting/empty state instead of stale or re-fetched data.
//
// Uses Query Farm's Haybarn build of DuckDB-Wasm (@haybarn/haybarn-wasm), whose
// quack extension loads and can ATTACH to a 2.0 server. The official
// @duckdb/duckdb-wasm `next` (1.33.1-dev114.0) is on the 2.0 engine too, but
// `LOAD quack` failed there when tried on 2026-11-08. Only the threaded variant works: quack needs
// real threads, which needs a cross-origin-isolated page, so collector.py
// serves this page with COOP/COEP headers. index.html uses the same package, pinned to
// the same version (test_pages.py checks), but its non-threaded build — the shop
// needs no quack, so no isolation.
// Pinned to an exact rc rather than @latest. Caveat: the quack extension itself is
// fetched from Haybarn's repository at a fixed v2.0.0 path that they replace in
// place, so a pin can stop matching it (rc7 did, after 2026-10-30; rc12 matches).
// If the dashboard shows "waiting for the live Quack connection…" with an
// extension "could not be loaded" warning in the console, bump this.
const HAYBARN = 'https://cdn.jsdelivr.net/npm/@haybarn/haybarn-wasm@2.0.0-rc12/dist';
let hasQuack = false, quackConn = null;

async function bootQuack() {
  try {
    const duckdb = await import(`${HAYBARN}/duckdb-browser.mjs`);
    const workerUrl = URL.createObjectURL(
      new Blob([`importScripts("${HAYBARN}/duckdb-browser-threads.worker.js");`], { type: 'text/javascript' })
    );
    const worker = new Worker(workerUrl);
    const db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(), worker);
    await db.instantiate(`${HAYBARN}/duckdb-threads.wasm`, `${HAYBARN}/duckdb-browser-threads.pthread.worker.js`);
    URL.revokeObjectURL(workerUrl);
    quackConn = await db.connect();
    await quackConn.query(`INSTALL quack`);
    await quackConn.query(`LOAD quack`);
    const cfg = await (await fetch('/config')).json();   // where the collector's quack endpoint is, from the page's point of view
    await quackConn.query(`ATTACH '${cfg.quack_url}' AS remote (TOKEN '${cfg.quack_token}')`);
    hasQuack = true;
    window.tealXray?.set({ quack: true });
  } catch (e) {
    console.warn('quack unavailable — funnel/retention/daily will stay in their waiting state', e);
    window.tealXray?.set({ quack: false });
  }
}

const rowsOf = res => res.toArray().map(r => {
  const o = r.toJSON();
  for (const k in o) o[k] = num(o[k]);
  return o;
});

// 07_stress.py's concurrent-writer demo writes real event_types into this
// same table, so its rows count in every query below along with organic
// traffic — see its docstring.
async function queryLakeStats() {
  const [funnel] = rowsOf(await quackConn.query(`
    WITH gaps AS (
      SELECT user_id, event_ts, event_type,
             event_ts - LAG(event_ts) OVER (PARTITION BY user_id ORDER BY event_ts) AS gap
      FROM remote.events
    ), session_events AS (
      SELECT *, SUM(CASE WHEN gap IS NULL OR gap > INTERVAL 30 MINUTE THEN 1 ELSE 0 END)
                OVER (PARTITION BY user_id ORDER BY event_ts) AS session_num
      FROM gaps
    ), sessions AS (
      SELECT bool_or(event_type = 'add_to_cart') AS reached_cart,
             bool_or(event_type = 'purchase')    AS reached_purchase
      FROM session_events GROUP BY user_id, session_num
    )
    SELECT count(*) AS sessions,
           count(*) FILTER (WHERE reached_cart) AS carted,
           count(*) FILTER (WHERE reached_purchase) AS purchased,
           round(100.0 * count(*) FILTER (WHERE reached_cart) / count(*), 1) AS view_to_cart_pct,
           round(100.0 * count(*) FILTER (WHERE reached_purchase)
                 / nullif(count(*) FILTER (WHERE reached_cart), 0), 1) AS cart_to_purchase_pct
    FROM sessions
  `));

  const retention = rowsOf(await quackConn.query(`
    WITH activity AS (
      SELECT DISTINCT user_id, date_trunc('week', event_ts) AS active_week FROM remote.events
    ), cohort AS (
      SELECT user_id, min(active_week) AS cohort_week FROM activity GROUP BY user_id
    )
    SELECT CAST(date_diff('week', c.cohort_week, a.active_week) AS INTEGER) AS weeks_since,
           count(DISTINCT c.user_id) AS active_users
    FROM cohort c JOIN activity a USING (user_id)
    GROUP BY 1 ORDER BY 1
  `));

  const daily = rowsOf(await quackConn.query(`
    SELECT event_date::VARCHAR AS date,
           count(*) FILTER (WHERE event_type = 'pageview')    AS pageviews,
           count(*) FILTER (WHERE event_type = 'add_to_cart') AS carts,
           count(*) FILTER (WHERE event_type = 'purchase')    AS purchases
    FROM remote.events GROUP BY event_date ORDER BY event_date
  `));

  return { funnel, retention, daily };
}

// ---- live write-throughput counter for the concurrent-writer stress test
// (see 07_stress.py) — same quack connection as queryLakeStats(), but its
// own faster poll loop so the count visibly climbs while a stress test is
// running instead of waiting on the main 4s dashboard cycle. 07_stress.py's
// rows use real event_types (so they also count in queryLakeStats() above)
// but are tagged `props: {"stress": true}`, so this counts them
// specifically via that tag rather than event_type.
let lastStressCount = null, lastStressAt = null;
const STRESS_POLL_MS = 1000;

async function pollStressWrites() {
  if (!hasQuack) return;
  try {
    const [row] = rowsOf(await quackConn.query(
      `SELECT count(*) AS n FROM remote.events WHERE props->>'$.stress' = 'true'`
    ));
    const now = Date.now();
    if (lastStressCount !== null && row.n > lastStressCount) {
      const rate = (row.n - lastStressCount) / ((now - lastStressAt) / 1000);
      $('stressRate').textContent = ` · ${rate.toFixed(0)}/s`;
      $('stressBar').classList.add('show');
    }
    $('stressCount').textContent = row.n.toLocaleString('en');
    lastStressCount = row.n;
    lastStressAt = now;
  } catch (e) { /* transient — next tick retries */ }
}

function niceTicks(max) {
  if (max <= 0) return [0];
  const rough = max / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const err = rough / mag;
  const step = (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1) * mag;
  const ticks = [];
  for (let t = 0; t <= max; t += step) ticks.push(Math.round(t * 100) / 100);
  return ticks;
}

function roundedTopPath(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h));
  return `M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h} Z`;
}

// ---- shared y-axis scaffold: gridlines + tick labels + baseline --------------
function yAxis(ticks, max, marginLeft, marginTop, plotW, plotH) {
  let svg = '';
  for (const t of ticks) {
    const y = marginTop + plotH - (t / max) * plotH;
    svg += `<line x1="${marginLeft}" y1="${y}" x2="${marginLeft + plotW}" y2="${y}" class="gridline"/>`;
    svg += `<text x="${marginLeft - 8}" y="${y + 4}" class="axis-label" text-anchor="end">${fmtCompact(t)}</text>`;
  }
  svg += `<line x1="${marginLeft}" y1="${marginTop + plotH}" x2="${marginLeft + plotW}" y2="${marginTop + plotH}" class="axis-line"/>`;
  return svg;
}

// ---- vertical bar chart (funnel / revenue) ----------------------------------
function barChart({ data, valueFmt = String }) {
  const width = 520, height = 230;
  const marginLeft = 44, marginRight = 16, marginTop = 28, marginBottom = 30;
  const plotW = width - marginLeft - marginRight, plotH = height - marginTop - marginBottom;
  const max = Math.max(...data.map(d => d.value), 1) * 1.2;
  const gap = plotW / data.length;
  const bw = Math.min(24, gap * 0.5);
  let svg = `<svg viewBox="0 0 ${width} ${height}" class="chart-svg">`;
  svg += yAxis(niceTicks(max), max, marginLeft, marginTop, plotW, plotH);
  data.forEach((d, i) => {
    const cx = marginLeft + gap * i + gap / 2;
    const h = (d.value / max) * plotH;
    const y = marginTop + plotH - h;
    svg += `<path d="${roundedTopPath(cx - bw / 2, y, bw, h, 4)}" fill="${d.color}"><title>${d.label}: ${valueFmt(d.value)}</title></path>`;
    svg += `<text x="${cx}" y="${y - 8}" class="bar-value" text-anchor="middle">${valueFmt(d.value)}</text>`;
    svg += `<text x="${cx}" y="${marginTop + plotH + 20}" class="axis-label" text-anchor="middle">${d.label}</text>`;
  });
  svg += `</svg>`;
  return svg;
}

// ---- funnel: ordinal bars + drop-off annotations ----------------------------
function funnelChart(funnel) {
  const data = [
    { label: 'Sessions', value: num(funnel.sessions), color: 'var(--ord-1)' },
    { label: 'Carted', value: num(funnel.carted), color: 'var(--ord-2)' },
    { label: 'Purchased', value: num(funnel.purchased), color: 'var(--ord-3)' },
  ];
  const chart = barChart({ data, valueFmt: v => v.toLocaleString('en') });
  return `${chart}
    <div class="legend">
      <span class="legend-item">${funnel.view_to_cart_pct}% of sessions add to flock</span>
      <span class="legend-item">${funnel.cart_to_purchase_pct}% of those take them home</span>
    </div>`;
}

// ---- line chart: N series sharing an x-axis (1 series -> no legend, per the
// dataviz rule that a lone series needs no legend box) ------------------------
function lineChart({ data, series, width = 1040, height = 230 }) {
  const marginLeft = 44, marginTop = 20, marginBottom = 30;
  const marginRight = series.length > 1 ? 60 : 40;
  const plotW = width - marginLeft - marginRight, plotH = height - marginTop - marginBottom;
  const max = Math.max(...data.flatMap(d => series.map(s => num(d[s.key]))), 1) * 1.15;
  const stepX = data.length > 1 ? plotW / (data.length - 1) : 0;

  let svg = `<svg viewBox="0 0 ${width} ${height}" class="chart-svg">`;
  svg += yAxis(niceTicks(max), max, marginLeft, marginTop, plotW, plotH);

  // sparse x-axis labels so they don't collide when there are many points
  const labelEvery = Math.max(1, Math.ceil(data.length / 8));
  data.forEach((d, i) => {
    if (i % labelEvery === 0 || i === data.length - 1) {
      const x = marginLeft + stepX * i;
      svg += `<text x="${x}" y="${marginTop + plotH + 20}" class="axis-label" text-anchor="middle">${d.x}</text>`;
    }
  });

  for (const s of series) {
    const pts = data.map((d, i) => ({
      x: marginLeft + stepX * i,
      y: marginTop + plotH - (num(d[s.key]) / max) * plotH,
      v: num(d[s.key]),
    }));
    const path = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x + ',' + p.y).join(' ');
    svg += `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    pts.forEach(p => svg += `<circle cx="${p.x}" cy="${p.y}" r="4" fill="${s.color}" stroke="var(--chart-surface)" stroke-width="2"><title>${s.label}: ${p.v}</title></circle>`);
    const last = pts[pts.length - 1];
    svg += `<text x="${last.x + 8}" y="${last.y + 4}" class="end-label" text-anchor="start">${last.v}</text>`;
  }
  svg += `</svg>`;
  if (series.length <= 1) return svg;

  const legend = series.map(s => `<span class="legend-item"><span class="legend-swatch" style="background:${s.color}"></span>${s.label}</span>`).join('');
  return `<div class="legend">${legend}</div>${svg}`;
}

// ---- revenue by category ------------------------------------------------------
function revenueChart(rows) {
  const data = rows.map(r => ({
    label: `${CATEGORY_EMOJI[r.category] || ''} ${r.category}`,
    value: num(r.revenue_eur),
    color: CATEGORY_COLOR[r.category] || 'var(--cat-dabbling)',
  }));
  return barChart({ data, valueFmt: v => fmtQ(v) });
}

// ---- assemble the page --------------------------------------------------------
// d.funnel/retention/daily are `null` until the live Quack connection answers
// its first query — no /dashboard-data fallback for these three, see
// queryLakeStats(). `waiting` renders a placeholder instead of a chart;
// once non-null they're real results (possibly empty arrays/objects).
const waiting = `<div class="empty">Waiting for the live Quack connection…</div>`;
let prevData = null;

function render(d) {
  const conv = d.funnel && d.funnel.sessions
    ? (100 * num(d.funnel.purchased) / num(d.funnel.sessions)).toFixed(1) : null;
  const p = prevData;
  const changed = {
    revenue: p && num(p.totals.revenue_eur) !== num(d.totals.revenue_eur),
    orders: p && num(p.totals.orders) !== num(d.totals.orders),
    sessions: p && p.funnel && d.funnel && num(p.funnel.sessions) !== num(d.funnel.sessions),
    conv: p && p.funnel && p.funnel.sessions && d.funnel &&
      (100 * num(p.funnel.purchased) / num(p.funnel.sessions)).toFixed(1) !== conv,
    funnelChart: p && JSON.stringify(p.funnel) !== JSON.stringify(d.funnel),
    revenueChart: p && JSON.stringify(p.revenue_by_category) !== JSON.stringify(d.revenue_by_category),
    retentionChart: p && JSON.stringify(p.retention) !== JSON.stringify(d.retention),
    dailyChart: p && JSON.stringify(p.daily) !== JSON.stringify(d.daily),
  };
  $('content').innerHTML = `
    <div class="tiles">
      <div class="tile${changed.revenue ? ' pulse' : ''}"><div class="label">Total revenue (confirmed + shipped)</div><div class="value">${fmtQ(num(d.totals.revenue_eur))}</div></div>
      <div class="tile${changed.orders ? ' pulse' : ''}"><div class="label">Orders taken home</div><div class="value">${num(d.totals.orders).toLocaleString('en')}</div></div>
      <div class="tile${changed.sessions ? ' pulse' : ''}"><div class="label">Sessions</div><div class="value">${d.funnel ? num(d.funnel.sessions).toLocaleString('en') : '…'}</div></div>
      <div class="tile${changed.conv ? ' pulse' : ''}"><div class="label">Session &rarr; purchase</div><div class="value">${conv === null ? '…' : conv + '%'}</div></div>
    </div>

    <div class="cards">
      <div class="card${changed.funnelChart ? ' pulse' : ''}">
        <h2>🦆 Conversion funnel</h2>
        <div class="sub">Sessions that added to their flock, and of those, who took them home. Live via Quack.</div>
        <div class="xtag" data-xray="lake">${xr('lake')}</div>
        ${d.funnel ? funnelChart(d.funnel) : waiting}
      </div>
      <div class="card${changed.revenueChart ? ' pulse' : ''}">
        <h2>💰 Revenue by category</h2>
        <div class="sub">Confirmed + shipped orders only.</div>
        <div class="xtag" data-xray="oltp">${xr('oltp')}</div>
        ${d.revenue_by_category.length ? revenueChart(d.revenue_by_category) : `<div class="empty">No revenue yet.</div>`}
      </div>
      <div class="card wide${changed.retentionChart ? ' pulse' : ''}">
        <h2>🌊 Retention</h2>
        <div class="sub">Active users by weeks since their first visit — the pond drains, as ponds do. Live via Quack.</div>
        <div class="xtag" data-xray="lake">${xr('lake')}</div>
        ${d.retention === null ? waiting : (d.retention.length ? lineChart({
          data: d.retention.map(r => ({ x: num(r.weeks_since), value: num(r.active_users) })),
          series: [{ key: 'value', label: 'Active users', color: 'var(--teal)' }],
        }) : `<div class="empty">No retention data yet.</div>`)}
      </div>
      <div class="card wide${changed.dailyChart ? ' pulse' : ''}">
        <h2>📈 Daily activity</h2>
        <div class="sub">Pageviews, add-to-flocks, and completed orders per day across the lake. Live via Quack.</div>
        <div class="xtag" data-xray="lake">${xr('lake')}</div>
        ${d.daily === null ? waiting : (d.daily.length ? lineChart({
          data: d.daily.map(r => ({ x: r.date.slice(5), pageviews: num(r.pageviews), carts: num(r.carts), purchases: num(r.purchases) })),
          series: [
            { key: 'pageviews', label: 'Pageviews', color: 'var(--cat-dabbling)' },
            { key: 'carts', label: 'Add to flock', color: 'var(--cat-perching)' },
            { key: 'purchases', label: 'Taken home', color: 'var(--cat-diving)' },
          ],
        }) : `<div class="empty">No events yet.</div>`)}
      </div>
    </div>
  `;
  prevData = d;
}

const POLL_MS = 4000;
let pollTimer = null, hasLoadedOnce = false;

// funnel/retention/daily live here, independent of /dashboard-data's poll
// cycle — null until the first successful live query, then retained across
// any later failed tick (same "don't blank out over one bad tick" logic
// load() already applies to the rest of the page).
let lakeStats = { funnel: null, retention: null, daily: null };

async function load(isManual) {
  const btn = $('refreshBtn');
  if (isManual) btn.classList.add('spin');
  if (!hasLoadedOnce) {
    $('dot').className = 'dot loading';
    $('statusText').textContent = 'waddling the numbers together…';
  }
  try {
    const res = await fetch('/dashboard-data');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

    if (hasQuack) {
      try {
        lakeStats = await queryLakeStats();
      } catch (e) {
        console.warn('live quack query failed this tick — keeping last known values', e);
      }
    }

    render({ ...data, ...lakeStats });
    hasLoadedOnce = true;
    $('dot').className = 'dot ready';
    $('statusText').textContent = `🔴 live · every ${POLL_MS / 1000}s` +
      (hasQuack ? ' · funnel/retention/daily via Quack, client-side' : ' · waiting for Quack connection…') +
      ` · last update ${new Date().toLocaleTimeString()}`;
  } catch (err) {
    if (!hasLoadedOnce) {
      $('dot').className = 'dot';
      $('statusText').textContent = 'the pond drained — see below';
      $('content').innerHTML = `<div class="empty"><b>Couldn't load the dashboard.</b><br>
        ${String(err.message || err)}<br><br>
        Make sure you're running this via <code>python3 collector.py</code> (not a plain static server) —
        the dashboard needs its live <code>/dashboard-data</code> endpoint.</div>`;
    } else {
      // a live dashboard shouldn't blank itself out over one bad tick — keep
      // showing the last good numbers and just flag that the update failed.
      $('dot').className = 'dot';
      $('statusText').textContent = `⚠️ update failed (${String(err.message || err)}) — retrying…`;
    }
  } finally {
    if (isManual) setTimeout(() => btn.classList.remove('spin'), 600);
  }
}

function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(() => {
    if (document.visibilityState === 'visible') load(false);
  }, POLL_MS);
}

// catch up immediately when the tab regains focus, instead of waiting out the interval
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') load(false);
});

$('refreshBtn').addEventListener('click', e => { e.preventDefault(); load(true); });
bootQuack();  // fire-and-forget — WASM takes a few seconds to instantiate; /dashboard-data
              // already renders immediately, later ticks pick up the live path once ready
load(false);
startPolling();
setInterval(pollStressWrites, STRESS_POLL_MS);
</script>
</body>
</html>
